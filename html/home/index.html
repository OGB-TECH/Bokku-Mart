
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Welcome to Bokku Mart.">

    <title>Bokku Mart | Home</title>

    <!-- CSS Files -->
    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/base/variables.css">

    <link rel="stylesheet" href="../../css/components/header.css">
    <link rel="stylesheet" href="../../css/components/footer.css">
    <link rel="stylesheet" href="../../css/home/home.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header id="main-header">

        <nav class="navbar">

            <!-- Bokku Logo -->
            <a href="index.html" class="logo">
                <img src="../../assets/logos/logo-Bokku.svg"
                     alt="Bokku Mart Logo">
            </a>

            <!-- Navigation Links -->
            <ul class="nav-links">

                <li>
                    <a href="index.html" class="active">Home</a>
                </li>

                <li>
                    <a href="../pages/work-with-us.html">
                        Work With Us
                    </a>
                </li>

                <li>
                    <a href="../pages/partner-with-us.html">
                        Partner With Us
                    </a>
                </li>

                <li>
                    <a href="../pages/locations.html">
                        Locations
                    </a>
                </li>

                <li>
                    <a href="../pages/about.html">
                        About Us
                    </a>
                </li>

                <li>
                    <!-- Language / Globe Icon -->
                    <a href="#" class="language-icon" aria-label="Language options">
                        <i class="fa-solid fa-globe"></i>
                    </a>
                </li>

            </ul>


        </nav>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main>

        <!-- HERO SECTION -->
        <section class="hero">

            <div class="hero-content">

                <div class="hero-slider-wrapper">

                    <div class="hero-slider">

                        <div class="hero-slides">

                            <div class="hero-slide active">
                                <img src="../../assets/images/home-card-1.jpeg"
                                    alt="Bokku Mart truth">
                            </div>
                            
                            <div class="hero-slide">
                                <img src="../../assets/images/home-card-2.jpeg"
                                    alt="Bokku Mart products">
                            </div>

                            <div class="hero-slide">
                                <img src="../../assets/images/home-card-3.jpeg"
                                    alt="Bokku Mart products">
                            </div>

                            <div class="hero-slide">
                                <img src="../../assets/images/home-card-4.jpeg"
                                    alt="Bokku Mart gift card">
                            </div>
                        
                        </div>

                    </div>
                
                    <!-- SLIDER BUTTON -->

                    <!-- Previous Button -->
                    <button class="slider-btn prev-btn" aria-label="Previous slide">
                        &#10094;
                    </button>

                    <!-- Next Button -->
                    <button class="slider-btn next-btn" aria-label="Next slide">
                        &#10095;
                    </button>
                
                

                </div>
                
            </div>

        </section>


    </main>


    <!-- ================= FOOTER ================= -->

    <footer id="main-footer">

        <h2>Get in Touch</h2>

        <div class="social-links">

            <a href="#" aria-label="X">
                <i class="fa-brands fa-x-twitter"></i>
            </a>

            <a href="#" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>

            <a href="#" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="#" aria-label="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>

            <a href="mailto:info@bokku.com" aria-label="Email">
                <i class="fa-regular fa-envelope"></i>
            </a>

            <a href="#" aria-label="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>

            <a href="#" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>

        </div>

        <p>
            &copy; Copyright 2024. All Rights Reserved.
        </p>

    <script type="module" src="../../js/home/home.js"></script>
